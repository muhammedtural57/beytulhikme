<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beytü'l-Hikme | Ansiklopedi</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div id="slider-view">
    <div class="indicator"></div>
    <nav class="top-nav">
  <div class="logo">
    <img src="logo.png" alt="Beytü'l-Hikme" class="site-logo">
    <span>Beytü'l-Hikme | Ansiklopedi</span>
  </div>
  <div class="menu">
    <div class="nav-link active" id="nav-home-top" data-view="home">Ana Sayfa</div>
    <div class="nav-link" id="nav-lessons-top" data-view="lessons">Dersler ve Notlarım</div>
  </div>
</nav>
    <div id="demo"></div>
    <div class="details" id="details-even">
      <div class="place-box"><div class="text"></div></div>
      <div class="title-box-1"><div class="title-1"></div></div>
      <div class="title-box-2"><div class="title-2"></div></div>
      <div class="desc"></div>
      <div class="cta">
        <button type="button" class="bookmark" aria-label="Kaydet"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M6.32 2.577a49.255 49.255 0 0111.36 0c1.497.174 2.57 1.46 2.57 2.93V21a.75.75 0 01-1.085.67L12 18.089l-7.165 3.583A.75.75 0 013.75 21V5.507c0-1.47 1.073-2.756 2.57-2.93z" clip-rule="evenodd"/></svg></button>
        <button type="button" class="discover">Okumaya devam et...</button>
      </div>
    </div>
    <div class="details" id="details-odd">
      <div class="place-box"><div class="text"></div></div>
      <div class="title-box-1"><div class="title-1"></div></div>
      <div class="title-box-2"><div class="title-2"></div></div>
      <div class="desc"></div>
      <div class="cta">
        <button type="button" class="bookmark" aria-label="Kaydet"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M6.32 2.577a49.255 49.255 0 0111.36 0c1.497.174 2.57 1.46 2.57 2.93V21a.75.75 0 01-1.085.67L12 18.089l-7.165 3.583A.75.75 0 013.75 21V5.507c0-1.47 1.073-2.756 2.57-2.93z" clip-rule="evenodd"/></svg></button>
        <button type="button" class="discover">Okumaya devam et...</button>
      </div>
    </div>
    <div class="pagination" id="pagination">
      <div class="arrow arrow-left" role="button" tabindex="0" aria-label="Önceki"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></div>
      <div class="arrow arrow-right" role="button" tabindex="0" aria-label="Sonraki"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg></div>
      <div class="progress-sub-container"><div class="progress-sub-background"><div class="progress-sub-foreground"></div></div></div>
      <div class="slide-numbers" id="slide-numbers"></div>
    </div>
    <div class="cover"></div>
  </div>

  <div id="article-view" class="hidden">
    <button type="button" id="mobile-menu-btn" class="mobile-only" aria-label="Menü">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
    </button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
  <img src="logo.png" alt="Beytü'l-Hikme" class="site-logo">
  <span>Beytü'l-Hikme | Ansiklopedi</span>
</div>
        <div class="sidebar-actions">
          <!-- ANIMASYONLU NIGHT MODE TOGGLE -->
          <button type="button" id="theme-toggle" class="dn-switch" aria-pressed="false" aria-label="Tema değiştir" title="Tema">
            <span class="dn-track">
              <span class="dn-stars" id="dnTrackStars"></span>
              <span class="dn-shooting">
                <span class="dn-shoot s1"></span>
                <span class="dn-shoot s2"></span>
                <span class="dn-shoot s3"></span>
              </span>
              <span class="dn-moon" aria-hidden="true">🌙</span>
              <span class="dn-sun" aria-hidden="true"></span>
              <span class="dn-clouds" aria-hidden="true"></span>
            </span>
            <span class="dn-knob" aria-hidden="true"></span>
          </button>
          <button type="button" id="back-btn" title="Geri">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
          </button>
          <button type="button" id="sidebar-close-btn" class="sidebar-close-btn" aria-label="Menüyü kapat" title="Menüyü kapat">×</button>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" placeholder="Makale ara (en az 2 harf)..." autocomplete="off">
        <div class="search-results" id="search-results"></div>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" id="nav-home">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
          Ana Sayfa
        </a>
      </nav>
      <div class="accordion-menu">
        <div class="accordion-title">Tüm Maddeler (A–Z)</div>
        <div id="accordion-list"></div>
      </div>

      <div class="toc">
        <div class="toc-header">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
          İçindekiler
        </div>
        <div class="toc-list" id="toc-list"></div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="article-wrapper">
      <main class="article-main">
        <section class="article-summary-card" id="article-summary-card">
          <div class="summary-left">
            <div class="summary-avatar-wrap">
              <img id="summary-image" src="" alt="">
            </div>
            <h2 class="summary-title" id="summary-title"></h2>
            <div class="summary-arabic" id="summary-arabic"></div>
            <div class="summary-place" id="summary-place"></div>
            <p class="summary-lead" id="summary-lead"></p>
            <div class="summary-author">Müellif: <strong id="summary-author"></strong></div>
          </div>
          <div class="summary-right">
            <h3 class="summary-toc-heading">İçerik</h3>
            <div class="summary-sections" id="summary-sections"></div>
          </div>
        </section>
        <header class="dia-header">
          <h1 id="article-title"></h1>
          <div class="arabic-title" id="article-arabic"></div>
          <p class="lead" id="article-lead"></p>
          <div class="author-bar">
            <div class="author-info">Müellif: <strong id="article-author"></strong></div>
          </div>
        </header>
        <div class="article-body" id="article-body"></div>
        <section class="video-section" id="video-section">
          <h2>Videolar</h2>
          <div class="video-playlist" id="video-playlist"></div>
        </section>
        <div class="mobile-right-content" id="mobile-right-content"></div>
      </main>
      <aside class="right-panel">
        <div class="main-image-box">
          <img id="article-image" src="" alt="">
          <div class="image-caption" id="article-image-caption"></div>
        </div>
        <div class="related-box">
          <div class="related-label">BU MADDE</div>
          <div class="related-title" id="related-file-title"></div>
          <div class="related-sub">DOSYASINDA YER ALMAKTADIR.</div>
        </div>
        <div class="related-articles" id="related-articles"></div>
        <div class="media-box" id="media-box">
          <h4>Görseller &amp; Haritalar</h4>
          <div class="media-grid" id="media-grid"></div>
        </div>
      </aside>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Kapat">×</button>
    <button type="button" class="lightbox-prev" id="lightbox-prev" aria-label="Önceki">‹</button>
    <button type="button" class="lightbox-next" id="lightbox-next" aria-label="Sonraki">›</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <button type="button" id="scroll-top-btn" class="scroll-top-btn" aria-label="Yukarı çık" title="Yukarı çık">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
    </svg>
  </button>

  <script src="js/data-cards.js"></script>
  <script src="js/articles-index.js"></script>
  <script src="js/core.js"></script>
</body>
</html>
